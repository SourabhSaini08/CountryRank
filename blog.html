<body>
  <main id="main">

    <!-- Blog hero -->
    <section class="blog-hero">
      <div class="container">
        <div class="blog-hero-inner">
          <div class="blog-hero-text">
            <h1>World Blog</h1>
            <p class="subtitle">
              Explore in-depth articles, rankings, insights and analysis

    <div class="container">

            <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>

          <input type="search" id="blog-search-input" placeholder="Search articles…" aria-label="Search articles" autocomplete="off">
        </div>
        <select id="blog-sort" class="full-select" style="max-width:180px" aria-label="Sort articles">
          <option value="newest">Latest First</option>
          <option value="oldest">Oldest First</option>
          <option value="az">Title A-Z</option>
        </select>
      </div>
      <p class="result-count" id="blog-result-count" style="margin:8px 0 20px"></p>

      <!-- Blog grid -->
      <div id="blog-grid" class="blog-grid" aria-label="Blog articles"></div>

      <div id="blog-pagination" class="pagination-row" aria-label="Pagination"></div>

    </div>
